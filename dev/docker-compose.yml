name: ecomiq-woocommerce

x-database: &database
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

x-plugin: &plugin ..:/var/www/html/wp-content/plugins/ecomiq-for-woocommerce:ro
x-mu-plugins: &mu-plugins ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      - db
    ports:
      - 127.0.0.1:8888:80
    environment:
      <<: *database
      WORDPRESS_DEBUG: 1
      SITE_URL: https://localhost:8443
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_HOME', getenv( 'SITE_URL' ) );
        define( 'WP_SITEURL', getenv( 'SITE_URL' ) );
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress:/var/www/html
      - *plugin
      - *mu-plugins

  https:
    image: caddy:2.8-alpine
    depends_on:
      - wordpress
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro

  cli:
    image: wordpress:cli-php8.3
    profiles:
      - cli
    user: "33:33"
    depends_on:
      - db
    environment:
      <<: *database
    volumes:
      - wordpress:/var/www/html
      - *plugin
      - *mu-plugins

volumes:
  db:
  wordpress:
