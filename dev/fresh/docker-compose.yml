services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
  cli74:
    image: wordpress:cli-php7.4
    user: "0:0"
    working_dir: /site
    volumes:
      - ./site74:/site
      - ../../dist/ecomiq-for-woocommerce:/plugin:ro
      - ./check.php:/check.php:ro
      - ./run.sh:/run.sh:ro
    depends_on: [db]
  cli84:
    image: wordpress:cli-php8.4
    user: "0:0"
    working_dir: /site
    volumes:
      - ./site84:/site
      - ../../dist/ecomiq-for-woocommerce:/plugin:ro
      - ./check.php:/check.php:ro
      - ./run.sh:/run.sh:ro
    depends_on: [db]
